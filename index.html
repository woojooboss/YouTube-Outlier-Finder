<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유튜브 떡상 영상 분석기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #1a1a1a; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #777; margin-bottom: 1.5rem; }
  .card { background: #fff; border: 1px solid #e0ddd6; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
  label { font-size: 12px; color: #888; display: block; margin-bottom: 5px; }
  input[type=text], input[type=password], select {
    width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 14px; outline: none; transition: border-color .15s; background: #fff; color: #1a1a1a;
  }
  input:focus, select:focus { border-color: #999; }
  button { padding: 8px 16px; border: 1px solid #ccc; border-radius: 8px; background: #fff; font-size: 13px; cursor: pointer; transition: all .15s; color: #1a1a1a; }
  button:hover { background: #f0eeea; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; width: 100%; margin-top: 12px; padding: 11px; font-size: 14px; border-radius: 8px; }
  .btn-primary:hover:not(:disabled) { background: #333; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row input { flex: 1; }

  /* 모드 탭 */
  .mode-tabs { display: flex; gap: 0; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; background: #fff; }
  .mode-tab { flex: 1; padding: 11px; font-size: 14px; border: none; background: transparent; cursor: pointer; transition: all .15s; color: #888; border-radius: 0; }
  .mode-tab.active { background: #1a1a1a; color: #fff; font-weight: 500; }
  .mode-tab:hover:not(.active) { background: #f5f4f0; }

  .options-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
  .options-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .option-block { display: flex; flex-direction: column; gap: 5px; }
  .grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
  .metric { background: #f5f4f0; border-radius: 8px; padding: 0.75rem 1rem; }
  .metric-label { font-size: 11px; color: #999; margin-bottom: 3px; }
  .metric-val { font-size: 18px; font-weight: 600; }

  .video-item { border: 1px solid #e8e6e0; border-radius: 10px; padding: 0.85rem; margin-bottom: 8px; display: flex; gap: 12px; align-items: flex-start; text-decoration: none; color: inherit; transition: background .15s; }
  .video-item:hover { background: #f8f7f3; }
  .thumb-wrap { position: relative; flex-shrink: 0; }
  .thumb { width: 120px; height: 68px; border-radius: 6px; object-fit: cover; background: #eee; display: block; }
  .dur-badge { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.75); color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 3px; }
  .type-badge { position: absolute; top: 4px; left: 4px; font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: 600; }
  .type-short { background: #ff4444; color: #fff; }
  .type-long { background: #1a1a1a; color: #fff; }
  .video-info { flex: 1; min-width: 0; }
  .video-title { font-size: 13px; font-weight: 500; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
  .channel-name { font-size: 11px; color: #888; margin-bottom: 5px; }
  .video-meta { font-size: 11px; color: #888; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .badge { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 100px; font-weight: 600; }
  .badge-hot { background: #fde8e8; color: #c0392b; }
  .badge-warm { background: #fef3cd; color: #b7770d; }
  .rank-col { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; min-width: 52px; }
  .rank-val { font-size: 15px; font-weight: 700; color: #c0392b; }
  .rank-label { font-size: 10px; color: #bbb; }

  .error { background: #fde8e8; border: 1px solid #f5c6c6; border-radius: 8px; padding: 0.75rem 1rem; font-size: 13px; color: #c0392b; margin-bottom: 1rem; }
  .success { background: #e8f5e9; border: 1px solid #c8e6c9; border-radius: 8px; padding: 0.75rem 1rem; font-size: 13px; color: #2e7d32; margin-bottom: 1rem; }
  .empty { text-align: center; padding: 3rem; color: #aaa; font-size: 14px; line-height: 1.8; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #ccc; border-top-color: #333; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .section-title { font-size: 13px; font-weight: 600; color: #555; margin-bottom: 10px; margin-top: 4px; }
  .hint { font-size: 11px; color: #bbb; margin-top: 6px; line-height: 1.6; }
  .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { padding: 5px 14px; border: 1px solid #ddd; border-radius: 100px; font-size: 12px; cursor: pointer; background: #fff; transition: all .15s; }
  .chip.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .chip:hover:not(.active) { background: #f0eeea; }
  .progress-wrap { background: #f0eeea; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 13px; color: #555; }
  .progress-bar-track { background: #e0ddd6; border-radius: 4px; height: 6px; margin-top: 8px; overflow: hidden; }
  .progress-bar-fill { background: #1a1a1a; height: 6px; border-radius: 4px; transition: width .3s; }

  /* 채널 프로필 */
  .channel-profile { display: flex; align-items: center; gap: 12px; padding: 0.75rem 0 0.75rem; margin-bottom: 1rem; border-bottom: 1px solid #eee; }
  .ch-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #eee; flex-shrink: 0; }
  .ch-avatar-placeholder { width: 48px; height: 48px; border-radius: 50%; background: #e0ddd6; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .ch-info { flex: 1; }
  .ch-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
  .ch-meta { font-size: 12px; color: #888; }

  @media (max-width: 520px) {
    .options-grid { grid-template-columns: 1fr 1fr; }
    .grid4 { grid-template-columns: 1fr 1fr; }
    .grid3 { grid-template-columns: 1fr 1fr; }
    .thumb { width: 90px; height: 52px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>📈 유튜브 떡상 영상 분석기</h1>
  <p class="sub">키워드 검색 또는 특정 채널의 떡상 영상을 분석해드려요</p>

  <!-- API 키 -->
  <div class="card">
    <label>YouTube Data API 키</label>
    <div class="row">
      <input type="password" id="api-key" placeholder="AIzaSy..." />
      <button onclick="saveKey()">저장</button>
    </div>
    <p class="hint">🔑 API 키 발급: console.cloud.google.com → 사용자 인증 정보 → API 키 복사</p>
  </div>

  <div id="msg-area"></div>

  <!-- 모드 탭 -->
  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-keyword" onclick="setMode('keyword')">🔍 키워드로 검색</button>
    <button class="mode-tab" id="tab-channel" onclick="setMode('channel')">📺 채널 분석</button>
  </div>

  <!-- 키워드 모드 -->
  <div id="panel-keyword">
    <div class="card">
      <label>분석할 키워드</label>
      <input type="text" id="keyword-input" placeholder="예: 재테크, 다이어트, 마케팅, 부업, 영어공부" onkeydown="if(event.key==='Enter')startKeyword()" />
      <div class="options-grid">
        <div class="option-block">
          <label style="margin-top:10px">영상 형식</label>
          <select id="kw-video-type">
            <option value="all">전체 (롱폼 + 숏폼)</option>
            <option value="long">롱폼만 (1분 이상)</option>
            <option value="short">숏폼만 (60초 이하)</option>
          </select>
        </div>
        <div class="option-block">
          <label style="margin-top:10px">업로드 기간</label>
          <select id="kw-period">
            <option value="">전체 기간</option>
            <option value="week">최근 1주일</option>
            <option value="month" selected>최근 1개월</option>
            <option value="3month">최근 3개월</option>
            <option value="year">최근 1년</option>
          </select>
        </div>
        <div class="option-block">
          <label style="margin-top:10px">떡상 기준 (구독자 대비)</label>
          <select id="kw-threshold">
            <option value="0.3">0.3배 이상</option>
            <option value="0.5">0.5배 이상</option>
            <option value="1" selected>1배 이상</option>
            <option value="2">2배 이상</option>
            <option value="3">3배 이상</option>
          </select>
        </div>
      </div>
      <button class="btn-primary" onclick="startKeyword()" id="btn-keyword">🔍 떡상 영상 찾기</button>
    </div>
  </div>

  <!-- 채널 모드 -->
  <div id="panel-channel" style="display:none">
    <div class="card">
      <label>채널 URL 또는 @핸들</label>
      <input type="text" id="channel-input" placeholder="https://youtube.com/@채널명  또는  @채널명" onkeydown="if(event.key==='Enter')startChannel()" />
      <div class="options-grid-2">
        <div class="option-block">
          <label style="margin-top:10px">분석할 영상 수</label>
          <select id="ch-count">
            <option value="10">최근 10개</option>
            <option value="20" selected>최근 20개</option>
            <option value="30">최근 30개</option>
            <option value="50">최근 50개</option>
          </select>
        </div>
        <div class="option-block">
          <label style="margin-top:10px">영상 형식</label>
          <select id="ch-video-type">
            <option value="all">전체 (롱폼 + 숏폼)</option>
            <option value="long">롱폼만 (1분 이상)</option>
            <option value="short">숏폼만 (60초 이하)</option>
          </select>
        </div>
      </div>
      <button class="btn-primary" onclick="startChannel()" id="btn-channel">📺 채널 분석하기</button>
    </div>
  </div>

  <div id="progress-area"></div>
  <div id="results-area"></div>
</div>

<script>
let apiKey = '';
let allResults = [];
let currentLabel = '';

function saveKey() {
  const v = document.getElementById('api-key').value.trim();
  if (!v) return showMsg('API 키를 입력해주세요.', 'error');
  apiKey = v;
  showMsg('✅ API 키가 저장됐어요!', 'success');
}

function showMsg(msg, type) {
  const a = document.getElementById('msg-area');
  if (!msg) { a.innerHTML = ''; return; }
  a.innerHTML = `<div class="${type}">${msg}</div>`;
}

function showProgress(text, pct) {
  const a = document.getElementById('progress-area');
  if (text === null) { a.innerHTML = ''; return; }
  a.innerHTML = `<div class="progress-wrap"><span class="spinner"></span>${text}
    <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
  </div>`;
}

function setMode(m) {
  document.getElementById('tab-keyword').classList.toggle('active', m === 'keyword');
  document.getElementById('tab-channel').classList.toggle('active', m === 'channel');
  document.getElementById('panel-keyword').style.display = m === 'keyword' ? '' : 'none';
  document.getElementById('panel-channel').style.display = m === 'channel' ? '' : 'none';
  document.getElementById('results-area').innerHTML = '';
  showMsg('', '');
}

function fmtNum(n) {
  n = parseInt(n) || 0;
  if (n >= 100000000) return (n/100000000).toFixed(1) + '억';
  if (n >= 10000) return Math.round(n/10000) + '만';
  if (n >= 1000) return (n/1000).toFixed(1) + '천';
  return n.toString();
}

function parseDurSec(iso) {
  if (!iso) return 0;
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!m) return 0;
  return (parseInt(m[1]||0)*3600) + (parseInt(m[2]||0)*60) + parseInt(m[3]||0);
}

function fmtDur(sec) {
  if (!sec && sec !== 0) return '-';
  const h = Math.floor(sec/3600), mn = Math.floor((sec%3600)/60), s = sec%60;
  if (h > 0) return `${h}:${String(mn).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${mn}:${String(s).padStart(2,'0')}`;
}

function fmtDate(d) {
  return d ? d.slice(0,10).replace(/-/g,'.') : '-';
}

function getPeriodDate(period) {
  if (!period) return null;
  const d = new Date();
  if (period === 'week') d.setDate(d.getDate()-7);
  else if (period === 'month') d.setMonth(d.getMonth()-1);
  else if (period === '3month') d.setMonth(d.getMonth()-3);
  else if (period === 'year') d.setFullYear(d.getFullYear()-1);
  return d.toISOString();
}

async function yt(path) {
  const r = await fetch(`https://www.googleapis.com/youtube/v3/${path}&key=${apiKey}`);
  const d = await r.json();
  if (d.error) throw new Error(d.error.message);
  return d;
}

// ── 키워드 모드 ──────────────────────────────────────
async function startKeyword() {
  const kw = document.getElementById('keyword-input').value.trim();
  if (!kw) return showMsg('키워드를 입력해주세요.', 'error');
  if (!apiKey) return showMsg('먼저 API 키를 저장해주세요!', 'error');

  showMsg('', '');
  document.getElementById('results-area').innerHTML = '';
  const btn = document.getElementById('btn-keyword');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>분석 중...';

  const videoType = document.getElementById('kw-video-type').value;
  const period = document.getElementById('kw-period').value;
  const threshold = parseFloat(document.getElementById('kw-threshold').value);
  currentLabel = `"${kw}" 키워드`;

  try {
    showProgress('키워드로 영상 검색 중...', 15);
    let url = `search?part=id,snippet&q=${encodeURIComponent(kw)}&type=video&maxResults=50&order=viewCount`;
    if (videoType === 'short') url += '&videoDuration=short';
    else if (videoType === 'long') url += '&videoDuration=long';
    const after = getPeriodDate(period);
    if (after) url += `&publishedAfter=${encodeURIComponent(after)}`;

    const searchData = await yt(url);
    const items = searchData.items || [];
    if (!items.length) { showProgress(null,0); document.getElementById('results-area').innerHTML = '<div class="empty">검색 결과가 없어요.<br>다른 키워드나 기간을 선택해보세요.</div>'; return; }

    showProgress(`영상 ${items.length}개 정보 가져오는 중...`, 40);
    const vids = await yt(`videos?part=snippet,statistics,contentDetails&id=${items.map(i=>i.id.videoId).join(',')}`);

    showProgress('채널 구독자 수 확인 중...', 65);
    const chIds = [...new Set((vids.items||[]).map(v=>v.snippet.channelId))].join(',');
    const chData = await yt(`channels?part=statistics,snippet&id=${chIds}`);
    const chMap = {};
    (chData.items||[]).forEach(c => { chMap[c.id] = c; });

    showProgress('떡상 점수 계산 중...', 85);
    const scored = (vids.items||[]).map(v => {
      const ch = chMap[v.snippet.channelId] || {};
      const subs = parseInt(ch.statistics?.subscriberCount||0);
      const views = parseInt(v.statistics?.viewCount||0);
      const likes = parseInt(v.statistics?.likeCount||0);
      const comments = parseInt(v.statistics?.commentCount||0);
      const durSec = parseDurSec(v.contentDetails?.duration);
      const ratio = subs > 0 ? views/subs : 0;
      const isShort = durSec > 0 && durSec <= 60;
      return { v, subs, views, likes, comments, ratio, durSec, isShort, channelTitle: ch.snippet?.title || v.snippet?.channelTitle || '-' };
    }).filter(x => x.ratio >= threshold).sort((a,b) => b.ratio - a.ratio);

    showProgress(null, 0);
    allResults = scored;
    renderResults(scored, 'keyword', threshold);
  } catch(e) {
    showProgress(null, 0);
    showMsg('❌ ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.innerHTML = '🔍 떡상 영상 찾기';
  }
}

// ── 채널 모드 ──────────────────────────────────────
async function startChannel() {
  const inp = document.getElementById('channel-input').value.trim();
  if (!inp) return showMsg('채널 URL 또는 @핸들을 입력해주세요.', 'error');
  if (!apiKey) return showMsg('먼저 API 키를 저장해주세요!', 'error');

  showMsg('', '');
  document.getElementById('results-area').innerHTML = '';
  const btn = document.getElementById('btn-channel');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>분석 중...';

  const count = parseInt(document.getElementById('ch-count').value);
  const videoType = document.getElementById('ch-video-type').value;

  try {
    showProgress('채널 정보 가져오는 중...', 15);
    const ch = await resolveChannel(inp);
    const subs = parseInt(ch.statistics?.subscriberCount||0);
    currentLabel = ch.snippet?.title || '채널';

    showProgress('영상 목록 가져오는 중...', 35);
    const searchUrl = `search?part=id&channelId=${ch.id}&order=viewCount&type=video&maxResults=${count}`;
    const searchData = await yt(searchUrl);
    const ids = (searchData.items||[]).map(i=>i.id.videoId).join(',');
    if (!ids) { showProgress(null,0); document.getElementById('results-area').innerHTML = '<div class="empty">영상이 없어요.</div>'; return; }

    showProgress('영상 상세 정보 가져오는 중...', 65);
    const vids = await yt(`videos?part=snippet,statistics,contentDetails&id=${ids}`);

    showProgress('분석 중...', 85);
    let scored = (vids.items||[]).map(v => {
      const views = parseInt(v.statistics?.viewCount||0);
      const likes = parseInt(v.statistics?.likeCount||0);
      const comments = parseInt(v.statistics?.commentCount||0);
      const durSec = parseDurSec(v.contentDetails?.duration);
      const ratio = subs > 0 ? views/subs : 0;
      const isShort = durSec > 0 && durSec <= 60;
      return { v, subs, views, likes, comments, ratio, durSec, isShort, channelTitle: ch.snippet?.title || '-' };
    });

    // 형식 필터
    if (videoType === 'long') scored = scored.filter(x => !x.isShort);
    else if (videoType === 'short') scored = scored.filter(x => x.isShort);

    // 조회수 순 정렬
    scored.sort((a,b) => b.views - a.views);

    showProgress(null, 0);
    allResults = scored;
    renderResults(scored, 'channel', 0, ch, subs);
  } catch(e) {
    showProgress(null, 0);
    showMsg('❌ ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.innerHTML = '📺 채널 분석하기';
  }
}

async function resolveChannel(input) {
  input = input.trim().replace(/^https?:\/\/(www\.)?youtube\.com\//,'');
  const handle = input.replace(/^@/,'').split('/')[0];
  if (!input.startsWith('channel/')) {
    const d = await yt(`channels?part=id,snippet,statistics&forHandle=@${handle}`);
    if (d.items?.length) return d.items[0];
  }
  if (input.startsWith('channel/')) {
    const cid = input.replace('channel/','');
    const d = await yt(`channels?part=id,snippet,statistics&id=${cid}`);
    if (d.items?.length) return d.items[0];
  }
  throw new Error('채널을 찾지 못했어요. URL이나 @핸들을 다시 확인해주세요.');
}

// ── 결과 렌더링 ──────────────────────────────────────
function renderResults(scored, mode, threshold, ch, subs) {
  const area = document.getElementById('results-area');
  if (!scored.length) {
    area.innerHTML = `<div class="empty">조건에 맞는 영상이 없어요 😥<br><br>${mode==='keyword' ? '떡상 기준을 낮추거나 기간을 넓혀 다시 시도해보세요.' : '다른 채널이나 옵션을 바꿔 시도해보세요.'}</div>`;
    return;
  }

  const shorts = scored.filter(x => x.isShort);
  const longs = scored.filter(x => !x.isShort);

  let html = '';

  // 채널 모드: 채널 프로필
  if (mode === 'channel' && ch) {
    const thumb = ch.snippet?.thumbnails?.medium?.url || ch.snippet?.thumbnails?.default?.url || '';
    const totalViews = parseInt(ch.statistics?.viewCount||0);
    const videoCount = parseInt(ch.statistics?.videoCount||0);
    html += `<div class="card channel-profile">
      ${thumb ? `<img class="ch-avatar" src="${thumb}" alt="">` : '<div class="ch-avatar-placeholder">📺</div>'}
      <div class="ch-info">
        <div class="ch-name">${ch.snippet?.title || '-'}</div>
        <div class="ch-meta">구독자 ${fmtNum(subs)} · 총 조회수 ${fmtNum(totalViews)} · 영상 ${fmtNum(videoCount)}개</div>
      </div>
    </div>`;
  }

  // 통계
  if (mode === 'keyword') {
    const avgRatio = scored.reduce((s,x)=>s+x.ratio,0)/scored.length;
    html += `<div class="grid4">
      <div class="metric"><div class="metric-label">떡상 영상 수</div><div class="metric-val" style="color:#c0392b">${scored.length}개</div></div>
      <div class="metric"><div class="metric-label">롱폼</div><div class="metric-val">${longs.length}개</div></div>
      <div class="metric"><div class="metric-label">숏폼</div><div class="metric-val">${shorts.length}개</div></div>
      <div class="metric"><div class="metric-label">평균 떡상 배수</div><div class="metric-val">${avgRatio.toFixed(1)}배</div></div>
    </div>`;
  } else {
    const topViews = scored[0]?.views || 0;
    const avgViews = Math.round(scored.reduce((s,x)=>s+x.views,0)/scored.length);
    html += `<div class="grid3">
      <div class="metric"><div class="metric-label">분석한 영상 수</div><div class="metric-val">${scored.length}개</div></div>
      <div class="metric"><div class="metric-label">최고 조회수</div><div class="metric-val">${fmtNum(topViews)}</div></div>
      <div class="metric"><div class="metric-label">평균 조회수</div><div class="metric-val">${fmtNum(avgViews)}</div></div>
    </div>`;
  }

  // 필터 칩
  html += `<div class="filter-chips">
    <button class="chip active" onclick="filterResults('all', this)">전체 (${scored.length})</button>
    <button class="chip" onclick="filterResults('long', this)">롱폼 (${longs.length})</button>
    <button class="chip" onclick="filterResults('short', this)">숏폼 (${shorts.length})</button>
  </div>`;

  const titleText = mode === 'keyword'
    ? `🔥 ${currentLabel} 떡상 영상 — 구독자 대비 조회수 높은 순`
    : `🔥 ${currentLabel} 인기 영상 — 조회수 높은 순`;

  html += `<div class="section-title">${titleText}</div>`;
  html += `<div id="video-list">${buildVideoList(scored, mode)}</div>`;
  area.innerHTML = html;
}

function buildVideoList(list, mode) {
  if (!list.length) return '<div class="empty">해당하는 영상이 없어요.</div>';
  return list.map(({v, subs, views, likes, comments, ratio, durSec, isShort, channelTitle}) => {
    const tier = ratio >= 3 ? 'hot' : ratio >= 1 ? 'warm' : null;
    const thumb = v.snippet.thumbnails?.medium?.url || v.snippet.thumbnails?.default?.url || '';
    const url = `https://youtube.com/watch?v=${v.id}`;
    const rankVal = mode === 'keyword' ? ratio.toFixed(1) + '배' : fmtNum(views);
    const rankLbl = mode === 'keyword' ? '구독자 대비' : '조회수';
    return `
      <a class="video-item" href="${url}" target="_blank">
        <div class="thumb-wrap">
          ${thumb ? `<img class="thumb" src="${thumb}" alt="">` : '<div class="thumb"></div>'}
          <span class="dur-badge">${fmtDur(durSec)}</span>
          <span class="type-badge ${isShort ? 'type-short' : 'type-long'}">${isShort ? 'SHORT' : 'LONG'}</span>
        </div>
        <div class="video-info">
          <div class="video-title">${v.snippet.title}</div>
          ${mode === 'keyword' ? `<div class="channel-name">📺 ${channelTitle} · 구독자 ${fmtNum(subs)}</div>` : ''}
          <div class="video-meta">
            <span>👁 ${fmtNum(views)}</span>
            <span>👍 ${fmtNum(likes)}</span>
            <span>💬 ${fmtNum(comments)}</span>
            <span>📅 ${fmtDate(v.snippet.publishedAt)}</span>
            ${tier && mode==='keyword' ? `<span class="badge badge-${tier}">${tier==='hot'?'🔥 대떡상':'📈 떡상'}</span>` : ''}
          </div>
        </div>
        <div class="rank-col">
          <span class="rank-val">${rankVal}</span>
          <span class="rank-label">${rankLbl}</span>
        </div>
      </a>`;
  }).join('');
}

function filterResults(type, btn) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  const mode = document.getElementById('tab-keyword').classList.contains('active') ? 'keyword' : 'channel';
  let filtered = allResults;
  if (type === 'long') filtered = allResults.filter(x => !x.isShort);
  if (type === 'short') filtered = allResults.filter(x => x.isShort);
  document.getElementById('video-list').innerHTML = buildVideoList(filtered, mode);
}
</script>
</body>
</html>
